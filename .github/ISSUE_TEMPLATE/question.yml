name: 提问求助
description: 使用中的疑问或需要帮助
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        有问题？先看看 [README](../../blob/master/README.md) 的「用法」「配置」「已知限制」三节是否已有答案。

  - type: textarea
    id: question
    attributes:
      label: 问题描述
      description: 你想问什么？
      placeholder: 例如：面板一直不出现，日志里写着「需要屏幕录制权限」，但我已经授权了...
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 你尝试过什么（可选）
      description: 你已经尝试了哪些方法？
      placeholder: |
        例如：
        - 看了 README 的「用法」一节
        - 在系统设置里给 jev-jarvis 打勾了「屏幕录制」，并退出重开过

  - type: textarea
    id: environment
    attributes:
      label: 环境信息（如果相关）
      description: 如果问题与环境有关，请提供
      value: |
        - macOS 版本：[例如 macOS 26.5]
        - 微信版本：[例如 4.1.x]
        - 怎么启动的：[`./start.command` / 双击 `jev-jarvis.app`]
        - 权限状态：[屏幕录制 / 辅助功能 是否已授权]
        - 判断层 / 生成层：[用的是哪套，例如本地 decider-2b + deepseek-chat]
