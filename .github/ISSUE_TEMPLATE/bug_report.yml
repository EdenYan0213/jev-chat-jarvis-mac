name: Bug 报告
description: 报告一个缺陷或问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 Bug！请填写下面的信息帮助我们定位问题。
        面板的**状态行**通常会直接写出失败原因（例如「填入失败：…」「候选生成失败：…」），请一并贴上。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要描述遇到的问题
      placeholder: 例如：点「填入」之后微信输入框里没有出现候选文字...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 运行 `./start.command` 启动悬浮窗
        2. 微信里收到一条消息，等面板出候选
        3. 点某个候选的「填入」
        4. 输入框里没有文字，面板状态行写着「…」
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望应该发生什么？
      placeholder: 例如：候选文字应该出现在微信输入框里（接在已有内容后面）
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？面板状态行写了什么？有错误信息请完整粘贴
      placeholder: |
        例如：
        - 面板状态行：「填入失败：没找到微信输入框（微信改版了？）」
        - 日志（~/Library/Logs/jev-jarvis.log）片段
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 你的运行环境
      value: |
        - macOS 版本：[例如 macOS 26.5，`sw_vers -productVersion`]
        - 微信版本：[微信 → 关于，例如 4.1.x]
        - Python 版本：[运行 `uv run python --version`]
        - 怎么启动的：[`./start.command` / 双击 `jev-jarvis.app`]
        - 权限状态：[系统设置 → 隐私与安全性 中，**屏幕录制** / **辅助功能** 是否已授权给对应程序]
        - 判断层：[TypeSafe Jev（配了 TYPESAFE_API_KEY）/ 本地 decider-2b]
        - 生成层：[端点 + 模型名，例如 api.deepseek.com + deepseek-chat；`uv run python src/generate.py --check` 会显示]

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于定位问题的信息（可选）
      placeholder: 例如：只在群聊里出现、微信窗口最小化时出现、之前正常最近开始报错等
