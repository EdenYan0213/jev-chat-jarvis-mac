name: 功能请求
description: 提议新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你想要的功能或改进。
        提功能前建议先看 README 的「已知限制（V0 边界）」和「下一步」两节，确认是否已在计划内。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 你遇到了什么问题或不便？
      placeholder: 例如：群里消息刷得快时，面板追不上，我想让它只盯某个联系人...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望如何解决这个问题？
      placeholder: |
        例如：
        希望支持「只看指定会话」：
        在菜单栏 J 图标里勾选要监听的会话，其余会话不触发分析
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 你考虑过其他的实现方式吗？
      placeholder: 例如：也可以做成黑名单，把不想看的群排除掉

  - type: textarea
    id: constraints
    attributes:
      label: 与核心原则的兼容性（可选）
      description: 这个改动会不会触及「纯只读」原则？
      placeholder: |
        例如：
        - 需要新增权限吗？（屏幕录制 / 辅助功能）
        - 会不会把消息内容发到本机之外？（现在只有生成层会把消息发给第三方 LLM）
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关信息、截图或参考实现
